<nav class="navbar-aurion" *ngIf="currentUser()">
  <div class="navbar-brand" (click)="goToDashboard()">
    <img src="logo.svg" alt="AURION" class="navbar-logo" />
    <span class="navbar-title">AURION</span>
  </div>

  <button class="navbar-toggle d-lg-none" (click)="menuOpen = !menuOpen" [class.active]="menuOpen">
    <i class="bi" [class.bi-list]="!menuOpen" [class.bi-x-lg]="menuOpen"></i>
  </button>

  <div class="navbar-content" [class.open]="menuOpen">
    <div class="session-indicator d-none d-lg-flex">
      <span class="session-dot"></span>
      <span class="session-text">Sesión activa</span>
    </div>

    <div class="navbar-user" (click)="dropdownOpen = !dropdownOpen" #userMenu>
      <div class="user-avatar">
        <span class="avatar-initial">{{ getInitials() }}</span>
      </div>
      <div class="user-info d-none d-sm-flex">
        <span class="user-name">{{ currentUser()?.name }}</span>
        <span class="user-role">{{ currentUser()?.role }}</span>
      </div>
      <i class="bi bi-chevron-down dropdown-chevron d-none d-sm-block" [class.rotate]="dropdownOpen"></i>

      <div class="user-dropdown" *ngIf="dropdownOpen" @fadeIn>
        <div class="dropdown-header">
          <span class="dropdown-name">{{ currentUser()?.name }}</span>
          <span class="dropdown-email">{{ currentUser()?.email }}</span>
        </div>
        <div class="dropdown-divider"></div>
        <button class="dropdown-item" (click)="goToDashboard(); dropdownOpen = false">
          <i class="bi bi-grid"></i>
          <span>Dashboard</span>
        </button>
        <button class="dropdown-item text-error" (click)="logout(); dropdownOpen = false">
          <i class="bi bi-box-arrow-right"></i>
          <span>Cerrar sesión</span>
        </button>
      </div>
    </div>
  </div>
</nav>

<div class="navbar-overlay" *ngIf="menuOpen" (click)="menuOpen = false"></div>
